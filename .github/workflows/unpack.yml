name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q m3u-player-repo.zip
          rm -rf m3u-player/.git m3u-player/.github
          cp -r m3u-player/. .
          rm -rf m3u-player m3u-player-repo.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack M3U player project"
          git push
